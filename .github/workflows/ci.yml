name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Syntax check
        run: python -m compileall -q buglab app scripts
      - name: Test
        run: python -m pytest
      - name: CLI help
        run: python -m buglab.cli --help
