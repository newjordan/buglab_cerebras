<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Broken Controls Fixture</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f9fc;
        color: #1f2937;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px;
      }
      section {
        border: 1px solid #d7dce5;
        background: #fff;
        margin: 16px 0;
        padding: 16px;
        border-radius: 8px;
      }
      button, input, select {
        margin: 6px 4px 6px 0;
        padding: 8px 10px;
      }
      .status {
        min-height: 24px;
        border: 1px dashed #c7ceda;
        padding: 8px;
        margin-top: 8px;
      }
      .invisible-menu {
        position: absolute;
        left: -9999px;
      }
      .clipped {
        width: 120px;
        height: 26px;
        overflow: hidden;
        white-space: nowrap;
        border: 1px solid #c7ceda;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Broken Controls Fixture</h1>
      <section>
        <h2>Runtime Errors</h2>
        <button id="throw-error">Refresh Metrics</button>
        <button id="bad-fetch">Load Orders</button>
        <div id="runtime-status" class="status">Idle</div>
      </section>
      <section>
        <h2>State Failures</h2>
        <input id="account-name" placeholder="Account name">
        <button id="save-stuck">Save Account</button>
        <button id="add-row">Add Row</button>
        <table>
          <tbody id="rows"><tr><td>Existing row</td></tr></tbody>
        </table>
        <div id="state-status" class="status">No changes saved.</div>
      </section>
      <section>
        <h2>Navigation And Visibility</h2>
        <a id="missing-link" href="./missing-detail-page.html">Open Detail</a>
        <button id="menu-toggle" aria-expanded="false">Open Menu</button>
        <nav id="menu" class="invisible-menu">
          <a href="#one">Hidden One</a>
          <a href="#two">Hidden Two</a>
        </nav>
        <p class="clipped">This critical warning text is clipped and cannot be read completely.</p>
      </section>
    </main>
    <script>
      document.querySelector("#throw-error").addEventListener("click", () => {
        document.querySelector("#runtime-status").textContent = "Error: refresh failed";
        window.missingMetricsClient.reload();
      });

      document.querySelector("#bad-fetch").addEventListener("click", async () => {
        document.querySelector("#runtime-status").textContent = "Loading...";
        await fetch("/api/orders/not-found");
        document.querySelector("#runtime-status").textContent = "Loaded";
      });

      document.querySelector("#save-stuck").addEventListener("click", () => {
        document.querySelector("#state-status").textContent = "Invalid account: could not save";
      });

      document.querySelector("#add-row").addEventListener("click", () => {
        document.querySelector("#state-status").textContent = "Add failed: null row template";
      });

      document.querySelector("#menu-toggle").addEventListener("click", (event) => {
        event.currentTarget.setAttribute("aria-expanded", "true");
      });
    </script>
  </body>
</html>
